# Render Blueprint: backend API (Express + Neon Postgres)
services:
  - type: web
    name: ethiolingo-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true          # Render creates a strong random secret
      - key: DATABASE_URL
        sync: false                  # paste your Neon connection string in the dashboard
      - key: CORS_ORIGIN
        sync: false                  # e.g. https://your-app.vercel.app
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
